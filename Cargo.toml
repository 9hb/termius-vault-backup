[package]
name = "termius-vault-backup"
version = "0.1.2"
edition = "2024"
description = "CLI to decrypt & export Termius vaults directly into standard OpenSSH config and PEM keys"
authors = ["9hb"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
tar = "0.4"
flate2 = "1.0"
crypto_secretbox = "0.1.1"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.11"
